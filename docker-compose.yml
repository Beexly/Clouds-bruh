services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alterxiv
      POSTGRES_PASSWORD: alterxiv
      POSTGRES_DB: alterxiv
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alterxiv"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
