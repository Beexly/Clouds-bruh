<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eclipse · Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav__brand">
        <a href="/"><span class="wordmark">Eclipse</span></a>
        <span class="nav__net">Galaxy Network</span>
      </div>
      <nav class="nav__links">
        <a href="/#house">House</a>
        <a href="/#vault">Vault</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="hero__eyebrow">We are here</p>
        <h1 class="hero__title" style="font-size: var(--step-3)">Support</h1>
        <p class="hero__sub">Questions on an order, sizing, materials, or a return — send a note and the team replies by email.</p>
      </section>

      <form id="support-form" class="support-form">
        <input type="email" id="s-email" placeholder="you@example.com" required />
        <input type="text" id="s-order" placeholder="Order number (optional, e.g. ECL-2026-000001)" />
        <input type="text" id="s-subject" placeholder="Subject" />
        <textarea id="s-body" rows="6" placeholder="How can we help?" required></textarea>
        <button type="submit" class="btn-primary">Send message</button>
        <div id="s-result"></div>
      </form>
    </main>

    <footer class="foot">
      <span class="wordmark">Eclipse</span> — a Galaxy Network house · For those who already know
    </footer>

    <script>
      document.getElementById('support-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const out = document.getElementById('s-result');
        out.textContent = 'Sending…';
        try {
          const res = await fetch('/api/support', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('s-email').value,
              orderNumber: document.getElementById('s-order').value || undefined,
              subject: document.getElementById('s-subject').value,
              body: document.getElementById('s-body').value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to send');
          e.target.reset();
          out.innerHTML = `<div class="ok">${data.note}</div>`;
        } catch (err) {
          out.innerHTML = `<div class="err">${err.message}</div>`;
        }
      });
    </script>
  </body>
</html>
