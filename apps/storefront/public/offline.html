<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0D" />
    <title>Offline — Lumera</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: #0b0b0d;
        color: #e9e9ec;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
      }
      .ring { width: 64px; height: 64px; }
      h1 {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-weight: 300;
        letter-spacing: 0.08em;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        margin: 0;
        color: #f4eedd;
      }
      p { max-width: 28rem; margin: 0; color: #9a9aa0; font-size: 0.9rem; line-height: 1.6; }
      .eyebrow { text-transform: uppercase; letter-spacing: 0.28em; font-size: 0.65rem; color: #6b6b72; }
      button {
        margin-top: 0.5rem;
        border: 1px solid rgba(233, 216, 166, 0.4);
        background: transparent;
        color: #e9d8a6;
        padding: 0.85rem 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        font-size: 0.65rem;
        cursor: pointer;
        transition: border-color 0.2s ease;
      }
      button:hover { border-color: #e9d8a6; }
    </style>
  </head>
  <body>
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="17" fill="none" stroke="#E9D8A6" stroke-width="3.5" />
      <circle cx="32" cy="15" r="4" fill="#F4EEDD" />
    </svg>
    <p class="eyebrow">Lumera</p>
    <h1>The signal dropped</h1>
    <p>You're offline. The Broadcast resumes the moment you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
